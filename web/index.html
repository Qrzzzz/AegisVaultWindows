<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="description" content="在浏览器本地完成 AGV1 文本加密、解密与严格 Base64 转换。" />
    <title>AegisVault Web</title>
  </head>
  <body>
    <main>
      <header><span class="eyebrow">AEGISVAULT · LOCAL FIRST</span><h1>AegisVault <span>Web</span></h1><p>让文字，只留给持有密码的人。</p></header>
      <nav aria-label="工作区">
        <button id="crypto-tab" type="button" aria-pressed="true">加密 / 解密</button>
        <button id="base64-tab" type="button" aria-pressed="false">Base64</button>
      </nav>
      <section aria-label="文本工作区">
        <p id="hint">兼容 Windows 版 AGV1 文本协议。请妥善保存密码，密码无法找回。</p>
        <div id="password-row">
          <label for="password">密码</label>
          <div class="password-control"><input id="password" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" /><button id="show-password" type="button" aria-pressed="false">显示密码</button></div>
        </div>
        <div class="editors">
          <div><label for="input">输入</label><textarea id="input" spellcheck="false" autocomplete="off" placeholder="输入任意 UTF-8 文本，或粘贴 AGV1. 密文"></textarea></div>
          <div><label for="output">结果</label><textarea id="output" readonly spellcheck="false" autocomplete="off" placeholder="处理结果会显示在这里"></textarea></div>
        </div>
        <div class="actions"><button id="forward" class="primary" type="button">加密</button><button id="reverse" type="button">解密</button><button id="cancel" type="button" hidden>取消</button><span class="spacer"></span><button id="swap" type="button">交换输入输出</button><button id="copy" type="button">复制结果</button><button id="clear" type="button">清空</button></div>
        <p id="status" role="status" aria-live="polite" aria-atomic="true">就绪 · 所有计算在此浏览器本地完成</p>
      </section>
      <footer><p>不上传内容，不保存密码或文本。Base64 不是加密。</p><p>网页代码的供应链信任模型与本地 Windows 应用不同。高敏感数据优先使用桌面版。</p><p class="limits">仅支持文本；明文上限 1,507,294 UTF-8 字节 / UTF-16 单元，密文输入上限 2 MiB。</p></footer>
      <noscript>请启用 JavaScript；加密与 Base64 转换均在浏览器本地执行。</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
