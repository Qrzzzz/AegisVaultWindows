version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:47"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
