name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: pwsh

jobs:
  build-and-attest:
    name: Build, audit and attest
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      checksums_name: ${{ steps.metadata.outputs.checksums_name }}
      commit: ${{ steps.ref.outputs.commit }}
      exe_name: ${{ steps.metadata.outputs.exe_name }}
      notes_path: ${{ steps.metadata.outputs.notes_path }}
      sbom_name: ${{ steps.metadata.outputs.sbom_name }}
      tag: ${{ steps.metadata.outputs.tag }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Initialize isolated Python environment
        run: .\scripts\initialize_ci_environment.ps1 -ExportGitHubEnvironment
      - name: Validate source version and derive artifact names
        id: metadata
        run: python scripts/release_metadata.py --expected-tag "${{ github.ref_name }}" --github-output $env:GITHUB_OUTPUT
      - name: Bind annotated tag, event SHA and default branch
        id: ref
        run: >-
          python scripts/verify_release_ref.py
          --expected-tag "${{ github.ref_name }}"
          --expected-commit "${{ github.sha }}"
          --default-branch "${{ github.event.repository.default_branch }}"
          --require-clean
          --github-output $env:GITHUB_OUTPUT
      - name: Install hash-locked dependencies
        run: .\scripts\install_locked_dependencies.ps1
      - name: Verify source and build the release bundle
        env:
          AEGISVAULT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.AEGISVAULT_SIGNING_CERTIFICATE_BASE64 }}
          AEGISVAULT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.AEGISVAULT_SIGNING_CERTIFICATE_PASSWORD }}
          AEGISVAULT_TIMESTAMP_URL: ${{ vars.AEGISVAULT_TIMESTAMP_URL }}
        run: |
          $SigningMode = "${{ vars.AEGISVAULT_SIGNING_MODE }}"
          if ([string]::IsNullOrWhiteSpace($SigningMode)) { $SigningMode = "Optional" }
          .\scripts\verify_release.ps1 `
            -Build -Zip -RequireClean `
            -ExpectedTag "${{ steps.metadata.outputs.tag }}" `
            -ExpectedCommit "${{ steps.ref.outputs.commit }}" `
            -DefaultBranch "${{ github.event.repository.default_branch }}" `
            -SigningMode $SigningMode
      - name: Attest exact public assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.metadata.outputs.zip_name }}
            dist/${{ steps.metadata.outputs.sbom_name }}
            dist/${{ steps.metadata.outputs.checksums_name }}
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/${{ steps.metadata.outputs.exe_name }}
            dist/${{ steps.metadata.outputs.zip_name }}
            dist/${{ steps.metadata.outputs.sbom_name }}
            dist/${{ steps.metadata.outputs.checksums_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Verify draft and publish
    needs: build-and-attest
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-attest.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Initialize isolated Python environment
        run: .\scripts\initialize_ci_environment.ps1 -ExportGitHubEnvironment
      - name: Install hash-locked audit dependencies
        run: .\scripts\install_locked_dependencies.ps1
      - name: Download the exact build job output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-attest.outputs.artifact_name }}
          path: dist
      - name: Re-audit downloaded release bundle
        run: |
          $SigningMode = "${{ vars.AEGISVAULT_SIGNING_MODE }}"
          if ($SigningMode -ne "Required") { $SigningMode = "Optional" }
          if ($SigningMode -eq "Required") {
            .\scripts\sign_windows_artifact.ps1 `
              -Executable "dist/${{ needs.build-and-attest.outputs.exe_name }}" `
              -SigningMode Required
          }
          python scripts/audit_release_artifacts.py `
            --dist dist `
            --expected-tag "${{ needs.build-and-attest.outputs.tag }}" `
            --signing-mode $SigningMode
      - name: Verify exact assets and provenance, then publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_github_release.py
          --repo "${{ github.repository }}"
          --tag "${{ needs.build-and-attest.outputs.tag }}"
          --commit "${{ needs.build-and-attest.outputs.commit }}"
          --notes "${{ needs.build-and-attest.outputs.notes_path }}"
          --asset "dist/${{ needs.build-and-attest.outputs.zip_name }}"
          --asset "dist/${{ needs.build-and-attest.outputs.sbom_name }}"
          --asset "dist/${{ needs.build-and-attest.outputs.checksums_name }}"
          --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
