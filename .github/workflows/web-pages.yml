name: AegisVault Web Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'tests/fixtures/**'
      - 'tests/test_protocol_fixtures.py'
      - 'src/aegisvault/**'
      - 'requirements*.lock'
      - '.github/workflows/web-pages.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'tests/fixtures/**'
      - 'tests/test_protocol_fixtures.py'
      - 'src/aegisvault/**'
      - 'requirements*.lock'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r ../requirements-dev.lock
      - name: Python shared fixture and Web interoperability tests
        run: |
          python -m pytest ../tests/test_protocol_fixtures.py
          npm test
      - name: Build static site
        run: npm run build
      - name: Browser acceptance
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
